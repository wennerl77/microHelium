services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped

    command: tunnel --no-autoupdate run

    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Defina TUNNEL_TOKEN no arquivo .env}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - microhelium

networks:
  microhelium:
    external: true
    name: microhelium