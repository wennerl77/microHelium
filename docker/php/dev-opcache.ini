; MicroHelium Development OPcache Configuration
; Sobrescreve as configurações de produção para garantir recarregamento imediato
; (Hot Reload) de arquivos PHP e templates Blade sem necessidade de view:clear ou restarts.
[opcache]
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.enable_file_override=0
